<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CartShare</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<div class="home">

    <!-- Logo -->

    <div class="logo-card">

        <div class="logo">
            <i class="bi bi-bag-heart-fill"></i>
        </div>

        <h1>CartShare</h1>

        <p>Shop together, stress less.</p>

    </div>

    <!-- Name Card -->

    <div class="name-card">

        <div class="top-border"></div>

        <div class="card-body">

            <h2>Who are you?</h2>

            <span>Your name will appear next to the items you add.</span>

            <input
                type="text"
                placeholder="Enter your name">

        </div>

    </div>

    <!-- Option Cards -->

<div class="cards">

    <!-- Start Card -->

    <div class="card">

        <div class="icon green">

            <i class="bi bi-plus-lg"></i>

        </div>

        <h3>Start a Cart</h3>

        <p>Create a new shared shopping list.</p>

        <input
             class="cart-input"
             type="text"
             placeholder="e.g. Costco Run">

        <button class="create-btn">

            <i class="bi bi-plus-lg"></i>

            Create

        </button>

    </div>

    <!-- Join Card -->

    <div class="card">

        <div class="icon blue">

            <i class="bi bi-box-arrow-in-right"></i>

        </div>

        <h3>Join a Cart</h3>

        <p>Have a room code? Join instantly.</p>

        <input
            class="cart-input"
            type="text"
            placeholder="ABC123">

        <button class="join-btn">

            Join

            <i class="bi bi-arrow-right"></i>

        </button>

    </div>

</div>

<!-- Recent Cart -->

<div class="recent">

    <p>Or return to your recent cart:</p>

    <button>

        BK8PJ

        <i class="bi bi-arrow-right"></i>

    </button>

</div>

</div>

</div>

<script src="js/app.js"></script>

</body>

</html>
